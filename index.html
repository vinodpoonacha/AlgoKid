  grid.addEventListener('touchstart', down, {passive:true});
  grid.addEventListener('touchmove', move, {passive:false});
  grid.addEventListener('touchend', up);
  grid.addEventListener('mousedown', down);
  grid.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
function npTryWin(){ const np=G.np; if(np.path.length===np.total && npNumbersHit(np)===Object.keys(np.nums).length){ G.stars++; npPaint(); happy(); confetti(); if(typeof partyCharacters==='function') partyCharacters(); speakThen("Amazing! You filled every square!", npNext); return true; } return false; }
function tapNumPath(rr,cc){ const np=G.np; np.hint=null;
  if(np.path.length===0){ if(npNumAt(np,rr,cc)===1){ np.path.push([rr,cc]); pop(); npPaint(); } else { oops(); } return; }
  const idx=np.path.findIndex(function(p){return p[0]===rr&&p[1]===cc;});
  if(idx>=0){ if(idx===np.path.length-1) return; np.path=np.path.slice(0, idx+1); pop(); npPaint(); return; }
  const last=np.path[np.path.length-1];
  if(!npAdj(last,[rr,cc])) return;                       /* silently ignore: swiping over far cells */
  const n=npNumAt(np,rr,cc);
  if(n){ const expected=npNumbersHit(np)+1; if(n!==expected){ oops(); return; } }
  np.path.push([rr,cc]); pop();
  if(npTryWin()) return;
  npPaint();
}
function npUndo(){ const np=G.np; if(np.path.length){ np.path.pop(); np.hint=null; pop(); npPaint(); } }
function npHint(){ const np=G.np; const sol=np.sol; let k=0;
  while(k<np.path.length && k<sol.length && np.path[k][0]===sol[k][0] && np.path[k][1]===sol[k][1]) k++;
  np.path=np.path.slice(0,k);
  if(k<sol.length){ np.path.push([sol[k][0],sol[k][1]]); np.hint=[sol[k][0],sol[k][1]]; }
  pop(); if(npTryWin()) return; npPaint(); }
function npNext(){ if(G.ri+1<G.topic.rounds.length){ G.ri++; setupNumPath(); } else finish(G.topic.rounds.length, G.topic.rounds.length); }

/* ================= FILL SQUARES ENGINE ================= */
function startFill(key,topic){ G={key:key,topic:topic,accent:topic.color,ri:0,stars:0}; setupFill(); }
function fsFactors(n, rows, cols, wantSquare){
  if(wantSquare){ var s=Math.round(Math.sqrt(n)); return [s,s]; }
  for(var h=1; h<=Math.max(rows,cols); h++){ if(n%h===0){ var w=n/h; if(w!==h){
    if(w<=cols && h<=rows) return [w,h];
    if(h<=cols && w<=rows) return [h,w]; } } }
  return [n,1];
}
function fsPrompt(f){ var word=f.name==='square'?'SQUARE':'RECTANGLE';
  return 'Colour '+f.n+' blocks to make a '+word+'. It can go across OR down — anywhere you like!'; }
function fsShake(rr,cc){ const el=document.querySelector('#puzgrid .fscell[data-r="'+rr+'"][data-c="'+cc+'"]'); if(el){ el.classList.add('badcell'); setTimeout(function(){ el.classList.remove('badcell'); },320); } }
function setupFill(){ const r=G.topic.rounds[G.ri];
  G.fs={rows:r.rows,cols:r.cols,n:r.n,name:r.name,filled:{},order:[],won:false};
  renderFill();
  setTimeout(function(){ speak("Make a "+r.name+" using "+r.n+" blocks. Colour them across or down, anywhere you like!"); },300); }
function fsShapeChip(f){ var rep=fsFactors(f.n,f.rows,f.cols,f.name==='square'); var w=rep[0],h=rep[1];
  var u=14, gap=3, W=w*u+(w-1)*gap, H=h*u+(h-1)*gap, rects='';
  for(var r=0;r<h;r++){ for(var c=0;c<w;c++){ rects+='<rect x="'+(c*(u+gap))+'" y="'+(r*(u+gap))+'" width="'+u+'" height="'+u+'" rx="3" fill="#7C5CFC" opacity="0.22" stroke="#7C5CFC" stroke-width="1.5"/>'; } }
  var svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">'+rects+'</svg>';
  var word=f.name==='square'?'SQUARE':'RECTANGLE';
  return '<div style="display:flex;align-items:center;justify-content:center;gap:12px;background:#F3EEFF;border-radius:16px;padding:10px 14px;margin:2px auto 12px;max-width:340px;box-shadow:var(--shadow)">'+
    '<div style="width:44px;height:44px;border-radius:12px;background:#7C5CFC;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Nunito,sans-serif;font-weight:900;font-size:22px;flex:0 0 auto">'+f.n+'</div>'+
    '<div style="font-family:var(--head);font-weight:800;color:#5B3FD6;font-size:15px;line-height:1.25">Make a '+word+'<br><span style="font-size:12px;font-weight:700;color:#7C5CFC">'+f.n+' blocks — e.g. '+w+'\u00d7'+h+' (or turn it!)</span></div>'+
    '<div style="opacity:.9">'+svg+'</div>'+
    '</div>';
}
function renderFill(){ const f=G.fs; const cell=Math.min(60,Math.floor(300/f.cols)); const count=Object.keys(f.filled).length;
  let cells='';
  for(let rr=0;rr<f.rows;rr++){ for(let cc=0;cc<f.cols;cc++){ const key=rr+'_'+cc; const fill=f.filled[key];
    cells+='<div class="fscell '+(fill?'fill':'')+'" data-r="'+rr+'" data-c="'+cc+'" style="width:'+cell+'px;height:'+cell+'px"></div>'; } }
  view.innerHTML='<div class="screen">'+gameHead(G.topic,G.accent,G.ri,G.topic.rounds.length,G.stars)+
    '<div class="qcard"><p class="qtext">'+fsPrompt(f)+'</p></div>'+
    fsShapeChip(f)+
    '<div class="puzcount" id="puzcount">Coloured: '+count+' / '+f.n+'</div>'+
    '<div class="puzwrap" id="puzwrap"><div class="puzgrid" id="puzgrid" style="grid-template-columns:repeat('+f.cols+','+cell+'px)">'+cells+'</div></div>'+
    '<div class="puzbtns"><button class="kbtn puzbtn" onclick="fsUndo()">\u21b6 Undo</button><button class="kbtn puzbtn" onclick="fsHint()">\ud83d\udca1 Hint</button><button class="kbtn puzbtn" onclick="setupFill()">\u21ba Restart</button></div>'+
    '</div>';
  attachSwipe('fscell', swipeFill);
}
function fsPaint(){ const f=G.fs; const grid=document.getElementById('puzgrid'); if(!grid){ renderFill(); return; }
  const cnt=document.getElementById('puzcount');
  const cells=document.querySelectorAll('#puzgrid .fscell');
  for(let i=0;i<cells.length;i++){ const el=cells[i]; const r=el.getAttribute('data-r'), c=el.getAttribute('data-c'); el.classList.toggle('fill', !!f.filled[r+'_'+c]); }
  if(cnt) cnt.textContent='Coloured: '+Object.keys(f.filled).length+' / '+f.n;
}
function swipeFill(rr,cc){ const f=G.fs; if(f.won) return; const key=rr+'_'+cc;
  if(f.filled[key]) return;
  f.filled[key]=true; f.order.push(key); pop(); fsPaint(); fsCheck(true);
}
function tapFill(rr,cc){ const f=G.fs; if(f.won) return; const key=rr+'_'+cc;
  if(f.filled[key]){ delete f.filled[key]; const oi=f.order.indexOf(key); if(oi>=0) f.order.splice(oi,1); pop(); }
  else { f.filled[key]=true; f.order.push(key); pop(); }

}
function fsRectInfo(f){ var keys=Object.keys(f.filled); if(!keys.length) return null;
  var rs=keys.map(function(k){return +k.split('_')[0];}), cs=keys.map(function(k){return +k.split('_')[1];});
  var r0=Math.min.apply(null,rs),r1=Math.max.apply(null,rs),c0=Math.min.apply(null,cs),c1=Math.max.apply(null,cs);
  var h=r1-r0+1, w=c1-c0+1; return {w:w,h:h,count:keys.length,solid:(w*h===keys.length)}; }
function fsCheck(quiet){ const f=G.fs; if(f.won) return; const info=fsRectInfo(f); if(!info) return;
  if(info.count>f.n){ if(info.count===f.n+1){ oops(); if(!quiet) speak("That's too many! Undo one to make just "+f.n+"."); } return; }

  f.filled={}; f.order=[];
  for(var i=0;i<cells.length-1;i++){ f.filled[cells[i]]=true; f.order.push(cells[i]); }

}

<script>
(function(){
  var C = window.__CONTENT__; if(!C) return;
  function findTopic(sec,id){ return (C[sec]?C[sec].topics:[]).find(function(t){return t.id===id;}); }
  var SYM=['·','❓','➡️','⬅️','⬆️','⬇️','=','+','➕','➖','×','÷','↔️','⏳'];
  function tokens(big){ if(!big) return []; return String(big).split(/\s+/).filter(function(t){ return t && SYM.indexOf(t)<0 && !/^[0-9]+$/.test(t) && !/^[A-Za-z]$/.test(t); }); }
  function numOf(d){ var m=String(d||'').match(/\d+/); return m?parseInt(m[0],10):NaN; }

  /* ---- STACKS (plates) : options mention top / bottom ---- */
  ['stack'].forEach(function(id){ var t=findTopic('data',id); if(!t) return; t.questions.forEach(function(q){
    if(q.scene) return; var tb=q.options.some(function(o){return /top|bottom/i.test(o.t);});
    if(tb){ q.scene='plates'; q.options.forEach(function(o){ o.hi=/top/i.test(o.t)?'top':(/bottom/i.test(o.t)?'bottom':o.hi); }); }
  });});

  /* ---- QUEUES : options mention first/front or last/back ---- */
  ['queue'].forEach(function(id){ var t=findTopic('data',id); if(!t) return; t.questions.forEach(function(q){
    if(q.scene) return; var fl=q.options.some(function(o){return /first|front|last|back/i.test(o.t);});
    if(fl){ q.scene='queue'; q.options.forEach(function(o){ o.hi=/first|front/i.test(o.t)?'first':(/last|back/i.test(o.t)?'last':o.hi); }); }
  });});

  /* ---- POSITIONS / ORDINALS : row of items, highlight the matching one ---- */
  function tagRow(sec,id){ var t=findTopic(sec,id); if(!t) return; t.questions.forEach(function(q){
    if(q.scene) return; var items=tokens(q.big); if(items.length<2||items.length>6) return;
    var anyMatch=q.options.some(function(o){return items.indexOf(o.d)>=0;});
    if(!anyMatch) return;
    q.scene='row'; q.sceneData={items:items};
    q.options.forEach(function(o){ if(items.indexOf(o.d)>=0) o.hi=o.d; });
  });}
  tagRow('data','position');
  tagRow('olympiad','l2-ordinal');

  /* ---- NUMBER LINE : options are numbers ---- */
  function tagNum(sec,id,min,max){ var t=findTopic(sec,id); if(!t) return; t.questions.forEach(function(q){
    if(q.scene) return; var nums=q.options.map(function(o){return numOf(o.d);});

  (function(){ var t=findTopic('algorithms','sort'); if(!t) return; t.questions.forEach(function(q){

  eachQ(function(q){

  eachQ(function(q){

<script>
/* [AlgoKid Find the Path v28] — maze game: home -> school, picking up stars.

(function(){
  function key(r,c){ return r+'_'+c; }
  var DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  function fpParse(grid){ var rows=grid.length, cols=grid[0].length, walls={}, items=[], start=null, goal=null;
    for(var r=0;r<rows;r++){ var line=grid[r];
      for(var c=0;c<cols;c++){ var ch=line[c];
        if(ch==='#') walls[key(r,c)]=1; else if(ch==='H') start=[r,c];
        else if(ch==='G') goal=[r,c]; else if(ch==='*') items.push([r,c]); } }
    return {rows:rows,cols:cols,walls:walls,items:items,start:start,goal:goal}; }
  function fpSolve(p){ if(!p.start||!p.goal) return null; var need=p.items.length, maxCells=p.rows*p.cols;

    for(var limit=1; limit<=maxCells; limit++){ var visited={}; visited[key(p.start[0],p.start[1])]=1; var budget={n:300000};
      var res=dfs(p.start[0],p.start[1], startItem?1:0, [[p.start[0],p.start[1]]], limit, visited, budget); if(res) return res; }
    return null;
    function dfs(r,c,got,path,limit,visited,budget){ if(budget.n--<=0) return null;
      if(r===p.goal[0]&&c===p.goal[1]) return got===need ? path.slice() : null;
      if(path.length>=limit) return null;
      for(var d=0;d<DIRS.length;d++){ var nr=r+DIRS[d][0], nc=c+DIRS[d][1];
        if(nr<0||nc<0||nr>=p.rows||nc>=p.cols) continue; if(p.walls[key(nr,nc)]) continue;
        var k=key(nr,nc); if(visited[k]) continue;
        var isItem=p.items.some(function(it){return it[0]===nr&&it[1]===nc;});
        visited[k]=1; path.push([nr,nc]); var r2=dfs(nr,nc,got+(isItem?1:0),path,limit,visited,budget);
        if(r2) return r2; path.pop(); delete visited[k]; }

    var last=path[path.length-1]; if(Math.abs(last[0]-r)+Math.abs(last[1]-c)!==1) return {ok:false};

    'fp-1':{ level:1, id:'fp-1', title:'Find the Path', emoji:'🧭', color:'#EC4899', type:'findpath',
      intro:'Help Pip walk from home to school!', rounds:[
      { grid:['H..','...','..G'], story:'Draw a path from home to school.' },
      { grid:['H.#','.##','..G'], story:'Go around the wall to reach school.' },
      { grid:['..H','...','G..'], story:'Find the way to school.' },
      { grid:['H...','##.#','G...'], story:'Wind your way to school.' } ]},
    'fp-2':{ level:2, id:'fp-2', title:'Find the Path · 2', emoji:'🗺️', color:'#EC4899', type:'findpath',
      intro:'Longer paths — and sometimes pick up a star!', rounds:[
      { grid:['H..#','##..','...#','#..G'], story:'Find the longer way to school.' },

  function fpSvg(fp,geom){ var cell=geom.cell, gap=geom.gap; var ctr=function(i){return i*(cell+gap)+cell/2;};

  function fpCells(fp,geom){ var cell=geom.cell; var out='';
    for(var r=0;r<fp.rows;r++){ for(var c=0;c<fp.cols;c++){

      var hint=fp.hint&&fp.hint[0]===r&&fp.hint[1]===c;
      out+='<div class="npcell fpcell '+(wall?'fpwall':'')+' '+(onp?'onpath':'')+' '+(hint?'hintcell':'')+'" data-r="'+r+'" data-c="'+c+'" style="width:'+cell+'px;height:'+cell+'px;font-size:'+(cell*0.52).toFixed(0)+'px">'+(wall?'':em)+'</div>'; } }
    return out; }
  function fpRender(){ var fp=G.fp; var geom=fpGeom(fp); fp.geom=geom;
    var cell=geom.cell, gap=geom.gap; var W=fp.cols*cell+(fp.cols-1)*gap, H=fp.rows*cell+(fp.rows-1)*gap;
    var starLine=fp.items.length?('<div class="puzcount">⭐ '+fpCollected(fp)+' / '+fp.items.length+'</div>'):'';
    view.innerHTML='<div class="screen">'+gameHead(G.topic,G.accent,G.ri,G.topic.rounds.length,G.stars)+
      '<div class="qcard"><p class="qtext">'+fp.homeE+' → '+fp.goalE+'  '+fp.story+'</p></div>'+
      starLine+
      '<div class="puzwrap"><svg class="puzsvg" id="fpsvg" style="z-index:1" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+fpSvg(fp,geom)+'</svg>'+
      '<div class="puzgrid" id="puzgrid" style="grid-template-columns:repeat('+fp.cols+','+cell+'px)">'+fpCells(fp,geom)+'</div></div>'+
      '<div class="puzbtns"><button class="kbtn puzbtn" onclick="fpUndo()">↶ Undo</button><button class="kbtn puzbtn" onclick="fpHint()">💡 Hint</button><button class="kbtn puzbtn" onclick="fpSetupRestart()">↺ Restart</button></div>'+
      '</div>';
    if(typeof attachSwipe==='function') attachSwipe('fpcell', fpTap); }
  function fpPaint(){ var fp=G.fp; if(!fp||!fp.geom){ fpRender(); return; }
    var svg=document.getElementById('fpsvg'); if(!svg){ fpRender(); return; }
    svg.innerHTML=fpSvg(fp,fp.geom);
    var cells=document.querySelectorAll('#puzgrid .fpcell');
    for(var i=0;i<cells.length;i++){ var el=cells[i]; var r=+el.getAttribute('data-r'), c=+el.getAttribute('data-c');
      var wall=!!fp.walls[key(r,c)]; el.classList.toggle('onpath', fpInPath(fp,r,c));
      el.classList.toggle('hintcell', !!(fp.hint&&fp.hint[0]===r&&fp.hint[1]===c));
      if(!wall) el.innerHTML=fpEmojiAt(fp,r,c); }
    var sc=document.querySelector('.puzcount'); if(sc && fp.items.length) sc.textContent='⭐ '+fpCollected(fp)+' / '+fp.items.length; }
  function fpTap(r,c){ var fp=G.fp; fp.hint=null; var res=fpStep(fp,r,c);
    if(!res.ok){ if(res.badstart && typeof oops==='function'){ oops(); try{ speak('Start at the home!'); }catch(e){} } return; }
    if(typeof pop==='function') pop();
    if(res.win){ G.stars++; fpPaint(); if(typeof happy==='function')happy(); if(typeof confetti==='function')confetti(); if(typeof partyCharacters==='function')partyCharacters();
      if(typeof speakThen==='function') speakThen('You found the way to school! Wonderful!', fpNext); else setTimeout(fpNext,900); return; }
    fpPaint(); }
  window.fpUndo=function(){ var fp=G.fp; if(fp.path.length){ fp.path.pop(); fp.hint=null; if(typeof pop==='function')pop(); fpPaint(); } };
  window.fpHint=function(){ var fp=G.fp; var sol=fp.sol; if(!sol){ try{speak('Try going toward the school!');}catch(e){} return; }
    var k=0; while(k<fp.path.length && k<sol.length && fp.path[k][0]===sol[k][0] && fp.path[k][1]===sol[k][1]) k++;
    fp.path=sol.slice(0, Math.min(k+1, sol.length)); fp.hint=sol[Math.min(k,sol.length-1)]?sol[Math.min(k,sol.length-1)].slice():null;
    if(typeof pop==='function')pop();
    if(fpWin(fp)){ G.stars++; fpPaint(); if(typeof happy==='function')happy(); if(typeof confetti==='function')confetti();
      if(typeof speakThen==='function') speakThen('There it is! You made it!', fpNext); else setTimeout(fpNext,900); return; }
    fpPaint(); };
  window.fpSetupRestart=function(){ fpSetup(); };
  function fpNext(){ if(G.ri+1<G.topic.rounds.length){ G.ri++; fpSetup(); } else finish(G.topic.rounds.length, G.topic.rounds.length); }

  /* ---------- register topics into the Puzzles world ---------- */
  try{
    var C=window.__CONTENT__;
    if(C && C.puzzles && Array.isArray(C.puzzles.topics)){
      var existing={}; C.puzzles.topics.forEach(function(t){ existing[t.id]=1; });
      ['fp-1','fp-2','fp-3'].forEach(function(id){ if(!existing[id]) C.puzzles.topics.push(LEVELS[id]); });
      if(window.console&&console.log) console.log('[AlgoKid Find the Path v28] 3 maze topics added');
    }
  }catch(e){}

  /* ---------- tiny CSS for walls (reuses .npcell / .onpath / .puz*) ---------- */
  try{
    var st=document.createElement('style');
    st.textContent='.fpcell{display:flex;align-items:center;justify-content:center;line-height:1}.npcell.fpwall{background:#2A1E47;opacity:.55}.npcell.fpcell.onpath{background:#FBD9EC}';
    document.head.appendChild(st);
  }catch(e){}
})();

</script>
<script>
/* [AlgoKid version + whatsnew v28] — in-app version label, "What's New" changelog,
   and a "Check for Updates" button in Settings. Works with the existing SW update banner. */
(function(){
  window.AK_VERSION='v28';
  window.AK_WHATSNEW={
    'v28':['🧭 New game: Find the Path — guide Pip through mazes from home to school, picking up stars along the way',
           '🔄 Check for updates anytime from Settings',
           '✨ This "What\'s New" screen, so you can see each update'],
    'v27':['📚 New Class 2 topics: telling time, measurement, fractions, carrying & borrowing, odd/even, symmetry and more',
           '🎲 Endless Practice now includes word problems, skip-counting, shapes and coding-decoding puzzles'],
    'v26':['🗣️ Every question now explains the "why" out loud',
           '🎉 Correct answers teach the reason too, not just praise']
  };

  /* ----- Check for Updates (drives the existing SW registration) ----- */
  window.akCheckForUpdates=function(cb){
    var reg=window.__akReg;
    if(!reg || !('serviceWorker' in navigator)){ cb('unsupported'); return; }
    if(reg.waiting && navigator.serviceWorker.controller){ cb('ready', reg.waiting); return; }
    cb('checking');
    reg.update().then(function(){
      if(reg.waiting && navigator.serviceWorker.controller){ cb('ready', reg.waiting); return; }
      var nw=reg.installing;
      if(nw){ nw.addEventListener('statechange', function(){
        if(nw.state==='installed'){ cb(navigator.serviceWorker.controller?'ready':'fresh', nw); }
        else if(nw.state==='redundant'){ cb('uptodate'); } }); }
      else { cb('uptodate'); }
    }).catch(function(){ cb('error'); });
  };

  /* ----- "What's New" popup ----- */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  window.akShowWhatsNew=function(auto){
    if(document.getElementById('ak-wn-ov')) return;
    var v=window.AK_VERSION; var notes=(window.AK_WHATSNEW&&window.AK_WHATSNEW[v])||[];
    var items=notes.map(function(n){ return '<li style="margin:8px 0;line-height:1.4">'+esc(n)+'</li>'; }).join('');
    var ov=document.createElement('div'); ov.id='ak-wn-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(40,20,70,.5);display:flex;align-items:center;justify-content:center;padding:18px;font-family:var(--body,sans-serif)';
    ov.innerHTML='<div style="background:#fff;border-radius:22px;max-width:360px;width:100%;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'+
      '<div style="font-family:var(--head,sans-serif);font-weight:800;font-size:20px;color:#7C5CFC;text-align:center">✨ What\'s New</div>'+
      '<div style="text-align:center;font-weight:800;color:#9a7bff;margin:2px 0 10px;font-size:13px">Algo Kid '+esc(v)+(auto?' · just updated!':'')+'</div>'+
      '<ul style="margin:0;padding-left:20px;font-size:14px;color:#333">'+items+'</ul>'+
      '<button id="ak-wn-ok" class="kbtn btn-primary" style="width:100%;margin-top:16px;border-radius:14px;padding:12px;font-family:var(--head,sans-serif);font-weight:800;border:none;background:#7C5CFC;color:#fff">Got it!</button>'+
      '</div>';
    document.body.appendChild(ov);
    var ok=document.getElementById('ak-wn-ok');
    ok.onclick=function(){ ov.remove(); };
    ov.addEventListener('click', function(e){ if(e.target===ov) ov.remove(); });
    try{ if(typeof speak==='function') speak("Here's what's new in Algo Kid!"); }catch(e){}
  };

  /* ----- show automatically once, after an update (returning users) ----- */
  function maybeAutoShow(){
    try{
      var seen=localStorage.getItem('ak_seen_ver');
      var returning=!!(localStorage.getItem('ak_prog')||localStorage.getItem('ak_active')||localStorage.getItem('ak_profiles')||localStorage.getItem('ak_stars'));
      if(seen!==window.AK_VERSION){
        if(seen || returning){ setTimeout(function(){ try{ akShowWhatsNew(true); }catch(e){} }, 1600); }
        localStorage.setItem('ak_seen_ver', window.AK_VERSION);
      }
    }catch(e){}
  }
  maybeAutoShow();

  /* ----- inject version + buttons into Settings ----- */
  function injectVersionBox(){
    var sheet=document.querySelector('#settings .sheet'); if(!sheet || document.getElementById('ak-versionbox')) return;
    var box=document.createElement('div'); box.id='ak-versionbox';
    box.style.cssText='margin-top:18px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08);text-align:center';
    box.innerHTML='<div style="font-family:var(--head,sans-serif);font-weight:800;color:#7C5CFC;font-size:15px">Algo Kid '+esc(window.AK_VERSION)+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
        '<button class="kbtn" id="ak-checkupd" style="flex:1;background:#F3EEFF;color:#7C5CFC;border:none;border-radius:14px;padding:12px;font-family:var(--head,sans-serif);font-weight:800;font-size:14px">🔄 Check for Updates</button>'+
        '<button class="kbtn" id="ak-whatsnew" style="flex:1;background:#F3EEFF;color:#7C5CFC;border:none;border-radius:14px;padding:12px;font-family:var(--head,sans-serif);font-weight:800;font-size:14px">✨ What\'s New</button>'+
      '</div>'+
      '<div id="ak-updmsg" style="font-size:13px;margin-top:8px;min-height:16px;color:#777;font-family:var(--body,sans-serif)"></div>';
    sheet.appendChild(box);
    document.getElementById('ak-whatsnew').onclick=function(){ akShowWhatsNew(false); };
    document.getElementById('ak-checkupd').onclick=function(){
      var msg=document.getElementById('ak-updmsg');
      akCheckForUpdates(function(status, worker){
        if(status==='checking'){ msg.textContent='Checking for updates…'; msg.style.color='#777'; }
        else if(status==='ready'){ msg.textContent='✨ New version found! Updating…'; msg.style.color='#7C5CFC';
          if(window.__akShowUpdateBar && worker){ window.__akShowUpdateBar(worker); }
          else if(worker){ worker.postMessage('skipWaiting'); setTimeout(function(){ location.reload(); }, 600); } }
        else if(status==='uptodate' || status==='fresh'){ msg.textContent='✅ You have the latest version!'; msg.style.color='#22A06B'; }
        else if(status==='unsupported'){ msg.textContent='Updates are managed by your app store.'; msg.style.color='#777'; }
        else { msg.textContent='Could not check right now — please try again when online.'; msg.style.color='#B45309'; }
      });
    };
  }
  if(typeof window.openSettings==='function'){ var _os=window.openSettings; window.openSettings=function(){ _os.apply(this,arguments); try{ injectVersionBox(); }catch(e){} }; }
  else { document.addEventListener('click', function(){ setTimeout(injectVersionBox,50); }, {once:false}); }

  if(window.console&&console.log) console.log('[AlgoKid version '+window.AK_VERSION+'] what\'s-new + update-check ready');
})();

</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      window.__akReg = reg;
      function showUpdateBanner(worker){
        if (document.getElementById('akUpdateBar')) return;
        var bar = document.createElement('div'); bar.id='akUpdateBar';
        bar.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#7C5CFC;color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;font-family:var(--head,sans-serif);font-weight:800;font-size:14px;max-width:92vw';
        bar.innerHTML='<span>✨ A new version is ready!</span>';
        var btn=document.createElement('button');
        btn.textContent='Update'; btn.style.cssText='border:none;background:#fff;color:#7C5CFC;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit';
        btn.onclick=function(){ btn.textContent='Updating…'; if(worker) worker.postMessage('skipWaiting'); setTimeout(function(){ location.reload(); }, 400); };
        var later=document.createElement('button');
        later.textContent='Later'; later.style.cssText='border:none;background:transparent;color:#fff;opacity:.85;font-weight:800;cursor:pointer;font-family:inherit';
        later.onclick=function(){ bar.remove(); };
        bar.appendChild(btn); bar.appendChild(later); document.body.appendChild(bar);
        try{ if(typeof speak==='function') speak('A new version of Algo Kid is ready! Ask a grown-up to tap Update.'); }catch(e){}
      }
      window.__akShowUpdateBar = showUpdateBanner;
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(nw);
        });
      });
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if(reloaded) return; reloaded=true; location.reload(); });
      // Check for a fresh deploy periodically and when the app regains focus
      setInterval(function(){ reg.update().catch(function(){}); }, 60*60*1000);
      document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') reg.update().catch(function(){}); });
    }).catch(function(e){console.log('SW skip:',e&&e.message);});
  });
}
</script>
